<style>

/* ===== motion layer ===== */
:root{--e1:cubic-bezier(.22,1,.36,1);--e2:cubic-bezier(.34,1.56,.64,1);--e3:cubic-bezier(.65,0,.35,1)}
html{-webkit-tap-highlight-color:transparent}
body:before{display:none}
#bg{position:fixed;inset:-14vh 0;z-index:-1;pointer-events:none;will-change:transform}
#bg i{position:absolute;border-radius:50%;will-change:transform}
#bg i:first-child{width:78vmax;height:78vmax;left:-26vmax;top:-30vmax;background:radial-gradient(circle,var(--o1),transparent 66%);animation:drift 26s ease-in-out infinite alternate}
#bg i:last-child{width:70vmax;height:70vmax;right:-24vmax;bottom:-30vmax;background:radial-gradient(circle,var(--o2),transparent 66%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-8vmax,-6vmax,0) scale(1.15)}}
.pg.out{opacity:0;transform:translateY(-10px) scale(.992);transition:opacity .16s ease-in,transform .16s ease-in;pointer-events:none}
.rv{opacity:0;transform:translateY(24px) scale(.985);transition:opacity .75s var(--e1),transform .9s var(--e1)}
.rv.vis{opacity:1;transform:none}
.sw{animation:ttl .6s var(--e1)}@keyframes ttl{from{opacity:0;transform:translateY(10px)}}
.top{transition:box-shadow .35s,background-color .4s}.top.sc{box-shadow:0 10px 34px rgba(10,20,70,.14)}
#app.shell main{animation:shin .9s var(--e1) both}@keyframes shin{from{opacity:0;transform:translateY(16px)}}
#app.shell .bn{animation:dock 1s .1s var(--e2) both}@keyframes dock{from{opacity:0;transform:translateY(90px) scale(.96)}}
#app.shell .side{animation:sidein .9s var(--e1) both}@keyframes sidein{from{opacity:0;transform:translateX(-30px)}}
.bt,.sb{position:relative;overflow:hidden;isolation:isolate}
.bt.on{background:transparent}.sb.on{background:transparent;box-shadow:none}
.pill{position:absolute;inset:0;border-radius:inherit;z-index:-1}
